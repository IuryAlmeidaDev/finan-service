quarkus.http.port=8082
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
finance.attachments.directory=${ATTACHMENT_DIR:attachments}
quarkus.http.limits.max-body-size=10M

%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/finance_db}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.db-name=finance_db
%test.quarkus.datasource.devservices.image-name=postgres:16
%test.quarkus.kafka.devservices.enabled=true
quarkus.http.test-port=8082

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
quarkus.smallrye-openapi.info-title=Finance Service API
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
quarkus.smallrye-openapi.info-description=API do serviço financeiro do LifeOS — contas, transações, categorias, tags, orçamentos e metas.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
