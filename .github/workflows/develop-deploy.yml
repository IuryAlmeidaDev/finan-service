name: Finance Service - develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/iuryalmeidadev/finan-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: |
          mvn -B test


  build-and-deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:develop

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.VPS_SSH_KEY }}' > ~/.ssh/finan-deploy
          chmod 600 ~/.ssh/finan-deploy
          ssh-keyscan -H '${{ secrets.VPS_HOST }}' >> ~/.ssh/known_hosts

      - name: Upload Compose file
        shell: bash
        run: |
          ssh -i ~/.ssh/finan-deploy '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}' \
            'sudo mkdir -p /opt/finan-service && sudo tee /opt/finan-service/docker-compose.yml >/dev/null && sudo chmod 644 /opt/finan-service/docker-compose.yml' < deploy/docker-compose.yml

      - name: Deploy on VPS
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/finan-deploy \
            '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}' \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          ssh -i ~/.ssh/finan-deploy '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}' \
            'cd /opt/finan-service && IMAGE_TAG=develop docker compose pull app && IMAGE_TAG=develop docker compose up -d --remove-orphans'

      - name: Verify deployment
        shell: bash
        run: |
          ssh -i ~/.ssh/finan-deploy '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}' \
            'cd /opt/finan-service && docker compose ps && code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8082/ || true); test "$code" != "000"'
